# News Stock Sentiment Algorithm Configuration
# This file allows you to experiment with different parameters

# News Collection Settings
news:
  source: newsdata  # Options: 'newsdata' (recommended), 'worldnews'
  categories:
    - business
    - technology
    - politics
    - economy
  languages:
    - en
  max_articles_per_day: 100
  lookback_days: 7

# Stock Market Settings
stocks:
  # Major indices
  indices:
    - ^GSPC  # S&P 500
    - ^DJI   # Dow Jones
    - ^IXIC  # NASDAQ

  # Sectors to track
  sector_etfs:
    technology: XLK
    financial: XLF
    healthcare: XLV
    energy: XLE
    consumer: XLY
    industrial: XLI

  # Individual stocks (optional - add your own)
  watchlist:
    - AAPL
    - MSFT
    - GOOGL
    - AMZN
    - TSLA
    - NVDA

  # Data collection
  interval: 1d  # 1d, 1h, 5m, etc.
  period: 1mo   # 1d, 5d, 1mo, 3mo, 1y, etc.

# AI Analysis Parameters
ai_analysis:
  # Sentiment Analysis
  sentiment:
    model: "textblob"  # Options: textblob (free, simple), openai (API, $$), finbert (local ML model)
    threshold_positive: 0.6
    threshold_negative: -0.6

  # Industry Classification
  industry:
    enabled: true
    confidence_threshold: 0.7

  # Entity Recognition (People, Companies)
  entities:
    enabled: true
    extract_people: true
    extract_organizations: true
    extract_locations: true

  # Framing Analysis
  framing:
    enabled: true
    detect_bias: true

# Algorithm Scoring Parameters
# EXPERIMENT WITH THESE VALUES!
algorithm:
  version: "1.0"

  # Feature weights (must sum to 1.0)
  weights:
    sentiment_score: 0.35
    entity_relevance: 0.25
    source_diversity: 0.15
    volume_spike: 0.15
    framing_consistency: 0.10

  # Scoring rules
  scoring:
    # Sentiment multipliers
    positive_sentiment_multiplier: 1.2
    negative_sentiment_multiplier: 1.5  # Negative news often has more impact
    neutral_sentiment_multiplier: 0.5

    # Entity matching
    direct_company_mention: 2.0
    industry_mention: 1.0
    competitor_mention: 0.7

    # Source diversity bonus
    multiple_sources_bonus: 1.3
    conflicting_sentiment_penalty: 0.8

    # Volume analysis
    volume_spike_threshold: 1.5  # 150% of average
    volume_spike_multiplier: 1.4

  # Correlation settings
  correlation:
    time_window_hours: 24
    pre_news_baseline_days: 3
    post_news_tracking_days: 5

# Data Storage
storage:
  database_type: sqlite
  save_raw_articles: true
  save_analysis_results: true
  save_correlation_data: true
  retention_days: 365

# Experimentation Framework
experiments:
  enabled: true
  track_parameter_changes: true
  save_results: true
  results_directory: "experiments/results"

  # Metrics to track for each experiment
  metrics:
    - accuracy
    - precision
    - recall
    - f1_score
    - correlation_coefficient
    - roi_simulation

# Reporting
reporting:
  generate_daily_reports: true
  generate_weekly_summaries: true
  output_formats:
    - json
    - html
    - pdf
  charts:
    - sentiment_timeline
    - stock_correlation
    - source_comparison
    - entity_network
